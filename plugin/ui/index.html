<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STATE Kit</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/i18n.js" defer></script>
  <script src="assets/bridge-v1.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="page-head">
      <div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="pageTitle"></h1><p class="muted" data-i18n="subtitle"></p></div>
      <span id="connection-status" class="badge" data-i18n="connecting"></span>
    </header>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

    <form id="config-form" novalidate>
      <fieldset id="config-fields" disabled>
        <section class="card">
          <div class="section-heading">
            <div><h2 data-i18n="globalTitle"></h2><p class="muted" data-i18n="globalHelp"></p></div>
            <label class="switch-label"><input id="enabled" type="checkbox" role="switch"><span data-i18n="enable"></span></label>
          </div>
          <label for="harvest-dial-proxy-mode" data-i18n="frontProxy"></label>
          <select id="harvest-dial-proxy-mode"><option value="direct" data-i18n="direct"></option><option value="manual" data-i18n="manual"></option><option value="managed" id="managed-proxy-option" data-i18n="managed"></option></select>
          <div id="front-manual" hidden>
            <label for="harvest-dial-proxy-url" data-i18n="frontProxyURL"></label>
            <div class="input-action"><input id="harvest-dial-proxy-url" type="password" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:7890"><button id="toggle-front-proxy" type="button" class="secondary" aria-controls="harvest-dial-proxy-url" aria-pressed="false" data-i18n="show"></button></div>
          </div>
          <div id="front-managed" hidden><label for="harvest-dial-proxy-id" data-i18n="configuredProxy"></label><select id="harvest-dial-proxy-id"><option value="" data-i18n="chooseProxy"></option></select></div>
          <p id="proxy-discovery" class="help" data-i18n="loadingProxies"></p>
          <p class="help" data-i18n="proxyChainHelp"></p>
          <label for="dynamic-proxy-url" style="margin-top:16px" data-i18n="dynamicProxyURL"></label>
          <div class="input-action"><input id="dynamic-proxy-url" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="dynamicProxyPlaceholder"><button id="toggle-proxy" type="button" class="secondary" aria-controls="dynamic-proxy-url" aria-pressed="false" data-i18n="show"></button></div>
          <p class="help" data-i18n="dynamicProxyHelp"></p>
          <p class="help" data-i18n="disableHelp"></p>
          <label class="switch-label" style="margin-top:16px"><input id="observe-exit-ip" type="checkbox"><span data-i18n="observeIP"></span></label>
          <p class="help" data-i18n="observeIPHelp"></p>
        </section>

        <section class="card">
          <div class="section-heading"><div><h2 data-i18n="accountsTitle"></h2><p class="muted" data-i18n="accountsHelp"></p></div><span id="account-count" class="count"></span></div>
          <div class="add-account"><div><label for="new-account-id" data-i18n="accountID"></label><input id="new-account-id" type="text" inputmode="numeric" list="detected-accounts" autocomplete="off" data-i18n-placeholder="accountPlaceholder"><datalist id="detected-accounts"></datalist></div><button id="add-account" type="button" class="secondary" data-i18n="addAccount"></button></div>
          <p id="account-discovery" class="help" data-i18n="loadingAccounts"></p>
          <div class="table-wrap"><table class="accounts-table"><thead><tr><th scope="col" data-i18n="accountNameID"></th><th scope="col" data-i18n="switch"></th><th scope="col" data-i18n="planTicket"></th><th scope="col" data-i18n="model"></th><th scope="col"><span class="sr-only" data-i18n="action"></span></th></tr></thead><tbody id="accounts-body"></tbody></table></div>
          <p id="accounts-empty" class="empty" data-i18n="accountsEmpty"></p>
          <p class="help" data-i18n="modelsHelp"></p>
        </section>

        <details class="card advanced">
          <summary><span data-i18n="advanced"></span> <span class="muted" data-i18n="keepDefaults"></span></summary>
          <div class="field-grid">
            <div><label for="ttl-minutes" data-i18n="ttl"></label><input id="ttl-minutes" type="number" min="1" max="60" value="60" required></div>
            <div><label for="refresh-before-minutes" data-i18n="refreshBefore"></label><input id="refresh-before-minutes" type="number" min="0" max="59" value="10" required></div>
            <div><label for="max-attempts" data-i18n="maxAttempts"></label><input id="max-attempts" type="number" min="1" max="32" value="8" required></div>
            <div><label for="attempt-interval-seconds" data-i18n="attemptInterval"></label><input id="attempt-interval-seconds" type="number" min="1" max="300" value="10" required></div>
            <div><label for="cooldown-seconds" data-i18n="cooldown"></label><input id="cooldown-seconds" type="number" min="30" max="3600" value="300" required></div>
          </div>
          <p class="help" data-i18n="ttlHelp"></p>
        </details>
      </fieldset>

      <div class="action-bar"><div><span id="save-state" class="muted" data-i18n="loadingConfig"></span><p class="help" data-i18n="savedOnly"></p></div><div class="actions"><button id="test-config" type="button" class="secondary" disabled data-i18n="testSaved"></button><button id="save-config" type="button" disabled data-i18n="save"></button></div></div>
      <p id="test-help" class="help" data-i18n="testHelp"></p>
    </form>

    <section class="card status-card" aria-labelledby="tickets-title">
      <div class="section-heading"><div><h2 id="tickets-title" data-i18n="statusTitle"></h2><p id="status-summary" class="muted" data-i18n="loadingStatus"></p></div><button id="refresh-status" type="button" class="secondary" disabled data-i18n="refreshStatus"></button></div>
      <div class="table-wrap"><table><thead><tr><th scope="col" data-i18n="accountModel"></th><th scope="col" data-i18n="plan"></th><th scope="col" data-i18n="state"></th><th scope="col" data-i18n="remaining"></th><th scope="col" data-i18n="latest"></th></tr></thead><tbody id="tickets-body"></tbody></table></div>
      <p id="tickets-empty" class="empty" data-i18n="ticketsEmpty"></p>
      <p class="help" data-i18n="statusHelp"></p>
    </section>
    <section class="card" aria-labelledby="activity-title">
      <div class="section-heading"><div><h2 id="activity-title" data-i18n="activityTitle"></h2><p class="muted" data-i18n="activityHelp"></p></div></div>
      <div class="table-wrap activity-log"><table><thead><tr><th data-i18n="timeAccount"></th><th data-i18n="phase"></th><th data-i18n="exitIP"></th><th data-i18n="result"></th></tr></thead><tbody id="activity-body"></tbody></table></div>
      <p id="activity-empty" class="empty" data-i18n="activityEmpty"></p>
      <p class="help" data-i18n="activityPrivacy"></p>
    </section>
  </main>
</body>
</html>
